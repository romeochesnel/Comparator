<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparator</title>
  <script>
    const _t = localStorage.getItem('theme');
    if (_t) document.documentElement.setAttribute('data-theme', _t);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    /* ── Design tokens ── */
    :root {
      --font-ui:   'Fira Sans', system-ui, sans-serif;
      --font-mono: 'Fira Code', ui-monospace, monospace;
      --bg:          #F8FAFC;
      --surface:     #FFFFFF;
      --surface-2:   #F1F5F9;
      --border:      #E2E8F0;
      --border-2:    #CBD5E1;
      --text:        #0F172A;
      --text-2:      #334155;
      --text-muted:  #64748B;
      --primary:     #2563EB;
      --primary-h:   #1D4ED8;
      --primary-glow:rgba(37,99,235,.12);
      --success:     #059669;
      --success-bg:  rgba(5,150,105,.10);
      --danger:      #DC2626;
      --danger-bg:   rgba(220,38,38,.10);
      --js-clr:      #7C3AED;
      --js-bg:       rgba(109,40,217,.10);
      --trend-up:    #059669;
      --trend-up-bg: rgba(5,150,105,.10);
      --trend-dn:    #DC2626;
      --trend-dn-bg: rgba(220,38,38,.10);
      --trend-neu:   #64748B;
      --trend-neu-bg:rgba(100,116,139,.10);
      --radius:      14px;
      --radius-sm:   8px;
      --shadow:      0 1px 3px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.04);
      --shadow-h:    0 4px 14px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.06);
      --t:           .18s ease;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:          #0F172A;
        --surface:     #1E293B;
        --surface-2:   #1E293B;
        --border:      #334155;
        --border-2:    #475569;
        --text:        #F1F5F9;
        --text-2:      #CBD5E1;
        --text-muted:  #94A3B8;
        --primary:     #3B82F6;
        --primary-h:   #60A5FA;
        --primary-glow:rgba(59,130,246,.15);
        --success:     #10B981;
        --success-bg:  rgba(16,185,129,.12);
        --danger:      #F87171;
        --danger-bg:   rgba(248,113,113,.12);
        --js-clr:      #A78BFA;
        --js-bg:       rgba(167,139,250,.12);
        --trend-up:    #10B981;
        --trend-up-bg: rgba(16,185,129,.12);
        --trend-dn:    #F87171;
        --trend-dn-bg: rgba(248,113,113,.12);
        --trend-neu:   #94A3B8;
        --trend-neu-bg:rgba(148,163,184,.10);
        --shadow:      0 1px 3px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.2);
        --shadow-h:    0 4px 14px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.3);
      }
    }
    :root[data-theme="light"] {
      --bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F9;--border:#E2E8F0;--border-2:#CBD5E1;
      --text:#0F172A;--text-2:#334155;--text-muted:#64748B;
      --primary:#2563EB;--primary-h:#1D4ED8;--primary-glow:rgba(37,99,235,.12);
      --success:#059669;--success-bg:rgba(5,150,105,.10);
      --danger:#DC2626;--danger-bg:rgba(220,38,38,.10);
      --js-clr:#7C3AED;--js-bg:rgba(109,40,217,.10);
      --trend-up:#059669;--trend-up-bg:rgba(5,150,105,.10);
      --trend-dn:#DC2626;--trend-dn-bg:rgba(220,38,38,.10);
      --trend-neu:#64748B;--trend-neu-bg:rgba(100,116,139,.10);
      --shadow:0 1px 3px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.04);
      --shadow-h:0 4px 14px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.06);
    }
    :root[data-theme="dark"] {
      --bg:#0F172A;--surface:#1E293B;--surface-2:#1E293B;--border:#334155;--border-2:#475569;
      --text:#F1F5F9;--text-2:#CBD5E1;--text-muted:#94A3B8;
      --primary:#3B82F6;--primary-h:#60A5FA;--primary-glow:rgba(59,130,246,.15);
      --success:#10B981;--success-bg:rgba(16,185,129,.12);
      --danger:#F87171;--danger-bg:rgba(248,113,113,.12);
      --js-clr:#A78BFA;--js-bg:rgba(167,139,250,.12);
      --trend-up:#10B981;--trend-up-bg:rgba(16,185,129,.12);
      --trend-dn:#F87171;--trend-dn-bg:rgba(248,113,113,.12);
      --trend-neu:#94A3B8;--trend-neu-bg:rgba(148,163,184,.10);
      --shadow:0 1px 3px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.2);
      --shadow-h:0 4px 14px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.3);
    }

    /* ── Reset ── */
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      transition: background var(--t), color var(--t);
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 11px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      transition: background var(--t), border-color var(--t);
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 28px; height: 28px;
      background: var(--primary);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background var(--t);
    }
    .logo-mark svg { color: #fff; display: block; }
    header h1 {
      font-size: 1rem; font-weight: 700;
      letter-spacing: -0.02em; color: var(--text);
    }
    .header-right { display: flex; align-items: center; gap: 7px; }

    /* ── Buttons ── */
    .btn {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 0.83rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background var(--t), color var(--t), border-color var(--t), box-shadow var(--t);
    }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-h); border-color: var(--primary-h); }
    .btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text-2); border-color: var(--border-2); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
    .btn-danger:hover { filter: brightness(1.1); }
    .btn-icon { padding: 7px; background: transparent; color: var(--text-muted); border-color: var(--border); border-radius: var(--radius-sm); }
    .btn-icon:hover { background: var(--surface-2); color: var(--text-2); }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; gap: 4px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }

    /* ── Layout ── */
    .container { max-width: 820px; margin: 0 auto; padding: 22px 16px; }

    /* ── Form ── */
    #add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      transition: background var(--t), border-color var(--t);
    }
    #add-form h2 { font-size: 0.9rem; font-weight: 600; margin-bottom: 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.71rem; font-weight: 500; color: var(--text-muted); letter-spacing: .03em; }
    input[type="text"],input[type="url"],input[type="number"] {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-ui);
      font-size: 0.85rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      width: 100%;
      transition: border-color var(--t), box-shadow var(--t), background var(--t);
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .form-hint { font-size: .67rem; color: var(--text-muted); margin-top: 2px; }
    .form-actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
    .checkbox-row {
      grid-column: 1 / -1;
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: background var(--t), border-color var(--t);
    }
    input[type="checkbox"] { width: 16px !important; height: 16px; margin-top: 2px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
    .checkbox-label { font-size: .83rem; font-weight: 500; color: var(--text); cursor: pointer; }

    /* ── Tracker cards ── */
    .tracker-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 16px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color var(--t), box-shadow var(--t), background var(--t), transform var(--t);
    }
    .tracker-card:hover { border-color: var(--border-2); box-shadow: var(--shadow-h); transform: translateY(-1px); }
    .tracker-card.selected { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow), var(--shadow-h); }
    .tracker-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .tracker-top { display: flex; align-items: center; gap: 9px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; transition: background var(--t); }
    .status-dot.active   { background: var(--success); box-shadow: 0 0 0 2px var(--success-bg); }
    .status-dot.inactive { background: var(--border-2); }
    .status-dot.error    { background: var(--danger);  box-shadow: 0 0 0 2px var(--danger-bg); }
    .tracker-name { font-weight: 600; font-size: .9rem; flex: 1; min-width: 0; }
    .js-badge {
      background: var(--js-bg); color: var(--js-clr);
      font-size: .62rem; font-weight: 700;
      padding: 2px 6px; border-radius: 4px; letter-spacing: .03em; flex-shrink: 0;
    }
    .tracker-value { font-family: var(--font-mono); font-size: 1rem; font-weight: 600; color: var(--primary); flex-shrink: 0; }
    .tracker-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .tracker-url {
      font-size: .71rem; color: var(--text-muted); flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none;
    }
    .tracker-url:hover { color: var(--primary); text-decoration: underline; }
    .tracker-time { font-size: .71rem; color: var(--text-muted); white-space: nowrap; }
    .tracker-error { font-size: .71rem; color: var(--danger); margin-top: 3px; }
    .tracker-actions { display: flex; gap: 5px; margin-top: 9px; flex-wrap: wrap; }

    /* ── History panel ── */
    #history-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 10px;
      box-shadow: var(--shadow);
      transition: background var(--t), border-color var(--t);
    }
    .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .history-header h2 { font-size: .9rem; font-weight: 600; }
    #history-chart-wrapper { margin-bottom: 14px; }

    /* ── Stats bar ── */
    .stats-bar {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 16px;
      transition: background var(--t), border-color var(--t);
    }
    .stats-bar-title {
      font-size: .63rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 10px;
      display: flex; flex-direction: column; gap: 3px;
      transition: background var(--t), border-color var(--t);
    }
    .stat-chip.trend-up  { border-color: var(--trend-up); }
    .stat-chip.trend-dn  { border-color: var(--trend-dn); }
    .stat-label {
      font-size: .6rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
    }
    .stat-value { font-family: var(--font-mono); font-size: .86rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 4px; }
    .stat-chip.trend-up .stat-value { color: var(--trend-up); }
    .stat-chip.trend-dn .stat-value { color: var(--trend-dn); }
    .stat-chip.trend-neu .stat-value { color: var(--trend-neu); }

    /* ── History table ── */
    .history-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .history-table th {
      text-align: left; padding: 7px 10px;
      border-bottom: 2px solid var(--border);
      color: var(--text-muted); font-weight: 500;
      font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
    }
    .history-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text-2); }
    .history-table tr:last-child td { border-bottom: none; }
    .history-table td:first-child { font-family: var(--font-mono); font-weight: 500; color: var(--text); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .68rem; font-weight: 600; font-family: var(--font-mono); }
    .badge-ok  { background: var(--success-bg); color: var(--success); }
    .badge-err { background: var(--danger-bg);  color: var(--danger); }

    /* ── Empty state ── */
    #empty-state { text-align: center; padding: 60px 24px; color: var(--text-muted); }
    .empty-icon {
      width: 46px; height: 46px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px; color: var(--text-muted);
    }
    #empty-state strong { font-size: .95rem; color: var(--text); display: block; margin-bottom: 6px; }
    #empty-state p { font-size: .83rem; }

    /* ── Utils ── */
    .loading { opacity: .6; pointer-events: none; }
    .hidden  { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; transform: none !important; animation: none !important; }
    }
    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      header { padding: 10px 14px; }
      .tracker-value { font-size: .88rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
    <h1>Comparator</h1>
  </div>
  <div class="header-right">
    <button class="btn btn-icon" id="btn-theme" aria-label="Basculer le thème">
      <svg id="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg id="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button class="btn btn-primary" id="btn-toggle-form">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Ajouter
    </button>
  </div>
</header>

<div class="container">

  <div id="add-form" class="hidden">
    <h2 id="form-title">Nouveau tracker</h2>
    <form id="form-add" autocomplete="off">
      <div class="form-grid">
        <div class="form-group">
          <label for="f-name">Nom</label>
          <input id="f-name" type="text" placeholder="iPhone 15 Pro — Fnac" required>
        </div>
        <div class="form-group">
          <label for="f-interval">Intervalle (minutes)</label>
          <input id="f-interval" type="number" value="60" min="1" max="10080" required>
        </div>
        <div class="form-group full">
          <label for="f-url">URL à surveiller</label>
          <input id="f-url" type="url" placeholder="https://example.com/product" required>
        </div>
        <div class="form-group full">
          <label for="f-selector">Sélecteur CSS</label>
          <input id="f-selector" type="text" placeholder=".price, #stock-status, h1.title" required>
          <span class="form-hint">Identifie l'élément dont le texte sera extrait</span>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="f-js-render">
          <div>
            <label class="checkbox-label" for="f-js-render">Rendu JavaScript (Playwright)</label>
            <p class="form-hint">Pour les sites qui chargent les prix en JS : Amazon, Fnac… Plus lent (~3–5 s)</p>
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="btn-cancel">Annuler</button>
        <button type="submit" class="btn btn-primary" id="btn-save">Créer le tracker</button>
        <input type="hidden" id="f-editing-id">
      </div>
    </form>
  </div>

  <div id="trackers-container"></div>

  <div id="history-panel" class="hidden">
    <div class="history-header">
      <h2>Historique — <span id="history-title"></span></h2>
      <button class="btn btn-ghost btn-sm" id="btn-close-history">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        Fermer
      </button>
    </div>

    <div id="history-chart-wrapper">
      <canvas id="history-chart" height="70"></canvas>
    </div>

    <div id="stats-bar" class="stats-bar hidden">
      <p class="stats-bar-title">Statistiques</p>
      <div class="stats-grid">
        <div class="stat-chip">
          <span class="stat-label">Min aujourd'hui</span>
          <span class="stat-value" id="stat-today-min">—</span>
        </div>
        <div class="stat-chip">
          <span class="stat-label">Max aujourd'hui</span>
          <span class="stat-value" id="stat-today-max">—</span>
        </div>
        <div class="stat-chip" id="stat-trend-chip">
          <span class="stat-label">Tendance</span>
          <span class="stat-value" id="stat-trend">—</span>
        </div>
        <div class="stat-chip">
          <span class="stat-label">Min global</span>
          <span class="stat-value" id="stat-global-min">—</span>
        </div>
        <div class="stat-chip">
          <span class="stat-label">Max global</span>
          <span class="stat-value" id="stat-global-max">—</span>
        </div>
        <div class="stat-chip">
          <span class="stat-label">Moyenne</span>
          <span class="stat-value" id="stat-avg">—</span>
        </div>
      </div>
    </div>

    <table class="history-table">
      <thead>
        <tr>
          <th>Valeur</th><th>HTTP</th><th>Date</th><th>Erreur</th>
        </tr>
      </thead>
      <tbody id="history-tbody"></tbody>
    </table>
  </div>

</div>

<script>
  /* ── Theme ── */
  const html = document.documentElement;
  function isDark() {
    const t = html.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function syncThemeIcon() {
    const dark = isDark();
    document.getElementById('icon-sun').classList.toggle('hidden', dark);
    document.getElementById('icon-moon').classList.toggle('hidden', !dark);
  }
  syncThemeIcon();
  document.getElementById('btn-theme').addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    syncThemeIcon();
  });

  /* ── State ── */
  let trackers = [];
  let historyChart = null;
  let selectedId = null;
  let editingId = null;

  /* ── API ── */
  async function api(method, path, body) {
    const res = await fetch('/api' + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 204) return null;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur serveur');
    return data;
  }

  /* ── Helpers ── */
  function timeAgo(d) {
    if (!d) return 'Jamais';
    const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s / 60) + 'min';
    if (s < 86400) return Math.floor(s / 3600) + 'h';
    return Math.floor(s / 86400) + 'j';
  }
  function parseNum(str) {
    if (!str) return null;
    const m = str.replace(',', '.').match(/[\d.]+/);
    return m ? parseFloat(m[0]) : null;
  }
  function esc(v) {
    return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtDate(s) {
    return new Date(s).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
  }
  function fmtNum(n) {
    if (n === null || n === undefined) return '—';
    return n.toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  }

  /* ── SVG icons ── */
  const ICO = {
    refresh: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`,
    pause:   `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="4" x2="6" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/></svg>`,
    play:    `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
    edit:    `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
    trash:   `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
    trendUp: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
    trendDn: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>`,
    trendNeu:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`,
  };

  /* ── Trend ── */
  function computeTrend(entries) {
    const nums = entries.map(e => parseNum(e.value)).filter(n => n !== null);
    if (nums.length < 2) return 'neu';
    if (nums[0] > nums[1]) return 'up';
    if (nums[0] < nums[1]) return 'dn';
    return 'neu';
  }

  /* ── Stats bar ── */
  function renderStats(stats, trend) {
    const bar = document.getElementById('stats-bar');
    if (!stats || stats.count === 0) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');

    document.getElementById('stat-today-min').textContent  = fmtNum(stats.todayMin);
    document.getElementById('stat-today-max').textContent  = fmtNum(stats.todayMax);
    document.getElementById('stat-global-min').textContent = fmtNum(stats.globalMin);
    document.getElementById('stat-global-max').textContent = fmtNum(stats.globalMax);
    document.getElementById('stat-avg').textContent        = fmtNum(stats.globalAvg);

    const chip = document.getElementById('stat-trend-chip');
    const el   = document.getElementById('stat-trend');
    chip.className = 'stat-chip trend-' + trend;

    if (trend === 'up') {
      el.innerHTML = ICO.trendUp + ' hausse';
    } else if (trend === 'dn') {
      el.innerHTML = ICO.trendDn + ' baisse';
    } else {
      el.innerHTML = ICO.trendNeu + ' stable';
    }
  }

  /* ── Chart colors ── */
  function chartColors() {
    return isDark()
      ? { line: '#60A5FA', fill: 'rgba(96,165,250,.07)', grid: 'rgba(255,255,255,.06)', tick: '#94A3B8' }
      : { line: '#2563EB', fill: 'rgba(37,99,235,.06)',  grid: 'rgba(0,0,0,.06)',       tick: '#64748B' };
  }

  /* ── Render tracker cards ── */
  function render() {
    const c = document.getElementById('trackers-container');
    if (!trackers.length) {
      c.innerHTML = `
        <div id="empty-state">
          <div class="empty-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
          </div>
          <strong>Aucun tracker configuré</strong>
          <p>Cliquez sur "+ Ajouter" pour commencer à surveiller une URL.</p>
        </div>`;
      return;
    }
    c.innerHTML = trackers.map(t => {
      const l = t.latest;
      const dot = !t.active ? 'inactive' : l?.error ? 'error' : 'active';
      return `
        <div class="tracker-card${selectedId === t.id ? ' selected' : ''}" data-id="${t.id}" tabindex="0" role="button" aria-pressed="${selectedId === t.id}">
          <div class="tracker-top">
            <div class="status-dot ${dot}"></div>
            <span class="tracker-name">${esc(t.name)}</span>
            ${t.jsRender ? '<span class="js-badge">JS</span>' : ''}
            <span class="tracker-value">${l?.value ? esc(l.value) : '—'}</span>
          </div>
          <div class="tracker-meta">
            <a class="tracker-url" href="${esc(t.url)}" target="_blank" rel="noopener"
               onclick="event.stopPropagation()">${esc(t.url)}</a>
            <span class="tracker-time">${timeAgo(l?.checkedAt)}</span>
          </div>
          ${l?.error ? `<div class="tracker-error">${esc(l.error)}</div>` : ''}
          <div class="tracker-actions">
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();checkNow(${t.id})" aria-label="Vérifier maintenant">
              ${ICO.refresh} Vérifier
            </button>
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();toggleActive(${t.id},${t.active})" aria-label="${t.active ? 'Mettre en pause' : 'Activer'}">
              ${t.active ? ICO.pause + ' Pause' : ICO.play + ' Activer'}
            </button>
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditForm(${t.id})" aria-label="Modifier">
              ${ICO.edit} Éditer
            </button>
            <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteTracker(${t.id})" aria-label="Supprimer">
              ${ICO.trash}
            </button>
          </div>
        </div>`;
    }).join('');
  }

  /* ── Actions ── */
  async function loadTrackers() {
    trackers = await api('GET', '/trackers');
    render();
  }

  async function checkNow(id) {
    const card = document.querySelector(`[data-id="${id}"]`);
    card?.classList.add('loading');
    try {
      await api('POST', `/trackers/${id}/check`);
      await loadTrackers();
      if (selectedId === id) await loadHistory(id);
    } catch (e) { alert(e.message); }
    finally { card?.classList.remove('loading'); }
  }

  async function toggleActive(id, current) {
    await api('PATCH', `/trackers/${id}`, { active: !current });
    await loadTrackers();
  }

  async function deleteTracker(id) {
    if (!confirm('Supprimer ce tracker et tout son historique ?')) return;
    await api('DELETE', `/trackers/${id}`);
    if (selectedId === id) closeHistory();
    await loadTrackers();
  }

  /* ── History ── */
  async function loadHistory(id) {
    selectedId = id;
    render();

    const [tracker, entries] = await Promise.all([
      api('GET', `/trackers/${id}`),
      api('GET', `/history/${id}?limit=50`),
    ]);

    const stats = await api('GET', `/history/${id}/stats`).catch(() => null);

    document.getElementById('history-title').textContent = tracker.name;
    document.getElementById('history-panel').classList.remove('hidden');

    const rev = [...entries].reverse();
    const labels = rev.map(e => fmtDate(e.checkedAt));
    const nums = rev.map(e => parseNum(e.value));
    const hasNums = nums.some(v => v !== null);

    if (historyChart) historyChart.destroy();
    const wrapper = document.getElementById('history-chart-wrapper');

    if (hasNums) {
      wrapper.style.display = '';
      const c = chartColors();
      historyChart = new Chart(
        document.getElementById('history-chart').getContext('2d'), {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: tracker.name,
              data: nums,
              borderColor: c.line,
              backgroundColor: c.fill,
              tension: 0.35,
              fill: true,
              pointRadius: 3,
              pointHoverRadius: 5,
              pointBackgroundColor: c.line,
            }],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: false, grid: { color: c.grid }, ticks: { color: c.tick, font: { family: "'Fira Code', monospace", size: 11 } } },
              x: { grid: { color: c.grid }, ticks: { color: c.tick, font: { size: 10 }, maxRotation: 0, maxTicksLimit: 6 } },
            },
          },
        }
      );
    } else {
      wrapper.style.display = 'none';
    }

    renderStats(stats, computeTrend(entries));

    document.getElementById('history-tbody').innerHTML = entries.map(e => `
      <tr>
        <td>${e.value ? esc(e.value) : '<em style="color:var(--text-muted)">—</em>'}</td>
        <td><span class="badge ${e.statusCode && e.statusCode < 400 ? 'badge-ok' : 'badge-err'}">${e.statusCode ?? '—'}</span></td>
        <td>${fmtDate(e.checkedAt)}</td>
        <td style="color:var(--danger);font-size:.68rem">${e.error ? esc(e.error) : ''}</td>
      </tr>`).join('');

    document.getElementById('history-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function closeHistory() {
    selectedId = null;
    document.getElementById('history-panel').classList.add('hidden');
    document.getElementById('stats-bar').classList.add('hidden');
    if (historyChart) { historyChart.destroy(); historyChart = null; }
    render();
  }

  /* ── Form ── */
  function resetForm() {
    editingId = null;
    document.getElementById('form-add').reset();
    document.getElementById('f-editing-id').value = '';
    document.getElementById('form-title').textContent = 'Nouveau tracker';
    document.getElementById('btn-save').textContent = 'Créer le tracker';
    document.getElementById('add-form').classList.add('hidden');
  }

  function openEditForm(id) {
    const t = trackers.find(x => x.id === id);
    if (!t) return;
    editingId = id;
    document.getElementById('f-editing-id').value = id;
    document.getElementById('f-name').value = t.name;
    document.getElementById('f-url').value = t.url;
    document.getElementById('f-selector').value = t.selector;
    document.getElementById('f-interval').value = t.interval;
    document.getElementById('f-js-render').checked = t.jsRender;
    document.getElementById('form-title').textContent = 'Modifier le tracker';
    document.getElementById('btn-save').textContent = 'Enregistrer';
    document.getElementById('add-form').classList.remove('hidden');
    document.getElementById('add-form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('btn-toggle-form').addEventListener('click', () => {
    if (!document.getElementById('add-form').classList.contains('hidden') && editingId) {
      resetForm();
    } else {
      resetForm();
      document.getElementById('add-form').classList.toggle('hidden');
    }
  });
  document.getElementById('btn-cancel').addEventListener('click', resetForm);

  document.getElementById('form-add').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('btn-save');
    const isEdit = !!editingId;
    btn.disabled = true;
    btn.textContent = isEdit ? 'Enregistrement…' : 'Création…';
    try {
      const payload = {
        name:     document.getElementById('f-name').value,
        url:      document.getElementById('f-url').value,
        selector: document.getElementById('f-selector').value,
        interval: parseInt(document.getElementById('f-interval').value, 10),
        jsRender: document.getElementById('f-js-render').checked,
      };
      if (isEdit) {
        await api('PATCH', `/trackers/${editingId}`, payload);
      } else {
        await api('POST', '/trackers', payload);
      }
      resetForm();
      await loadTrackers();
      if (isEdit && selectedId === editingId) await loadHistory(editingId);
    } catch (err) { alert(err.message); }
    finally {
      btn.disabled = false;
      btn.textContent = isEdit ? 'Enregistrer' : 'Créer le tracker';
    }
  });

  document.getElementById('trackers-container').addEventListener('click', e => {
    const card = e.target.closest('.tracker-card');
    if (!card) return;
    const id = parseInt(card.dataset.id, 10);
    selectedId === id ? closeHistory() : loadHistory(id);
  });

  document.getElementById('trackers-container').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.tracker-card');
    if (!card) return;
    e.preventDefault();
    const id = parseInt(card.dataset.id, 10);
    selectedId === id ? closeHistory() : loadHistory(id);
  });

  document.getElementById('btn-close-history').addEventListener('click', closeHistory);

  loadTrackers();
  setInterval(loadTrackers, 30_000);
</script>
</body>
</html>
