<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --success: #16a34a;
      --error: #dc2626;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 14px 24px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }

    .btn { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background 0.15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { background: #fee2e2; color: var(--error); border: none; }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .container { max-width: 780px; margin: 0 auto; padding: 24px 16px; }

    /* Add form */
    #add-form { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
    #add-form h2 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
    input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; outline: none; transition: border-color 0.15s; width: 100%; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
    .form-hint { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .form-actions { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; }

    /* Tracker cards */
    .tracker-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
    .tracker-card:hover { border-color: #94a3b8; }
    .tracker-card.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }

    .tracker-top { display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.active   { background: var(--success); }
    .status-dot.inactive { background: #cbd5e1; }
    .status-dot.error    { background: var(--error); }
    .tracker-name { font-weight: 600; font-size: 0.95rem; flex: 1; }
    .tracker-value { font-size: 1.1rem; font-weight: 700; color: var(--primary); }

    .tracker-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .tracker-url { font-size: 0.73rem; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
    .tracker-url:hover { text-decoration: underline; }
    .tracker-time { font-size: 0.73rem; color: var(--muted); white-space: nowrap; }
    .tracker-error-msg { font-size: 0.73rem; color: var(--error); margin-top: 4px; }

    .tracker-actions { display: flex; gap: 6px; margin-top: 10px; }

    /* History panel */
    #history-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-top: 16px; box-shadow: var(--shadow); }
    .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .history-header h2 { font-size: 0.95rem; font-weight: 600; }
    #history-chart-wrapper { margin-bottom: 16px; }

    .history-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .history-table th { text-align: left; padding: 8px; border-bottom: 2px solid var(--border); color: var(--muted); font-weight: 500; }
    .history-table td { padding: 8px; border-bottom: 1px solid var(--border); }
    .history-table tr:last-child td { border-bottom: none; }

    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
    .badge-ok  { background: #dcfce7; color: var(--success); }
    .badge-err { background: #fee2e2; color: var(--error); }

    #empty-state { text-align: center; padding: 56px 24px; color: var(--muted); }
    #empty-state strong { font-size: 1rem; color: var(--text); }
    #empty-state p { margin-top: 6px; font-size: 0.85rem; }

    .loading { opacity: 0.6; pointer-events: none; }
    .hidden { display: none !important; }

    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
      .tracker-value { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Comparator</h1>
  <button class="btn btn-primary" id="btn-toggle-form">+ Ajouter</button>
</header>

<div class="container">

  <div id="add-form" class="hidden">
    <h2 id="form-title">Nouveau tracker</h2>
    <form id="form-add" autocomplete="off">
      <div class="form-grid">
        <div class="form-group">
          <label for="f-name">Nom</label>
          <input id="f-name" type="text" placeholder="Prix iPhone 15" required>
        </div>
        <div class="form-group">
          <label for="f-interval">Intervalle (minutes)</label>
          <input id="f-interval" type="number" value="60" min="1" max="10080" required>
        </div>
        <div class="form-group full">
          <label for="f-url">URL à surveiller</label>
          <input id="f-url" type="url" placeholder="https://example.com/product" required>
        </div>
        <div class="form-group full">
          <label for="f-selector">Sélecteur CSS</label>
          <input id="f-selector" type="text" placeholder=".price, #stock-status, h1.title" required>
          <span class="form-hint">Identifie l'élément dont le texte sera extrait</span>
        </div>
        <div class="form-group full" style="flex-direction:row;align-items:center;gap:10px">
          <input type="checkbox" id="f-js-render" style="width:auto;margin:0;cursor:pointer">
          <div>
            <label for="f-js-render" style="cursor:pointer;font-size:0.85rem;font-weight:500;color:var(--text)">Rendu JavaScript (Playwright)</label>
            <span class="form-hint">Pour les sites qui chargent les prix en JS : Amazon, Fnac… Plus lent (~3-5s)</span>
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="btn-cancel">Annuler</button>
        <button type="submit" class="btn btn-primary" id="btn-save">Créer le tracker</button>
        <input type="hidden" id="f-editing-id">
      </div>
    </form>
  </div>

  <div id="trackers-container"></div>

  <div id="history-panel" class="hidden">
    <div class="history-header">
      <h2>Historique — <span id="history-title"></span></h2>
      <button class="btn btn-ghost btn-sm" id="btn-close-history">✕ Fermer</button>
    </div>
    <div id="history-chart-wrapper">
      <canvas id="history-chart" height="70"></canvas>
    </div>
    <table class="history-table">
      <thead>
        <tr>
          <th>Valeur</th>
          <th>HTTP</th>
          <th>Date</th>
          <th>Erreur</th>
        </tr>
      </thead>
      <tbody id="history-tbody"></tbody>
    </table>
  </div>

</div>

<script>
  let trackers = [];
  let historyChart = null;
  let selectedId = null;
  let editingId = null;

  // --- API ---
  async function api(method, path, body) {
    const res = await fetch('/api' + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 204) return null;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur serveur');
    return data;
  }

  // --- Helpers ---
  function timeAgo(dateStr) {
    if (!dateStr) return 'Jamais';
    const s = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s / 60)}min`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    return `${Math.floor(s / 86400)}j`;
  }

  function parseNum(str) {
    if (!str) return null;
    const m = str.replace(',', '.').match(/[\d.]+/);
    return m ? parseFloat(m[0]) : null;
  }

  function esc(v) {
    return String(v ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(s) {
    return new Date(s).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
  }

  // --- Render trackers ---
  function render() {
    const c = document.getElementById('trackers-container');
    if (!trackers.length) {
      c.innerHTML = `<div id="empty-state"><strong>Aucun tracker configuré</strong><p>Cliquez sur "+ Ajouter" pour commencer à surveiller une URL.</p></div>`;
      return;
    }
    c.innerHTML = trackers.map(t => {
      const l = t.latest;
      const dot = !t.active ? 'inactive' : l?.error ? 'error' : 'active';
      return `
        <div class="tracker-card${selectedId === t.id ? ' selected' : ''}" data-id="${t.id}">
          <div class="tracker-top">
            <div class="status-dot ${dot}"></div>
            <span class="tracker-name">${esc(t.name)}</span>
            ${t.jsRender ? '<span style="background:#ede9fe;color:#6d28d9;font-size:.65rem;font-weight:600;padding:2px 6px;border-radius:4px;flex-shrink:0">JS</span>' : ''}
            <span class="tracker-value">${l?.value ? esc(l.value) : '—'}</span>
          </div>
          <div class="tracker-meta">
            <a class="tracker-url" href="${esc(t.url)}" target="_blank" rel="noopener"
               onclick="event.stopPropagation()">${esc(t.url)}</a>
            <span class="tracker-time">${timeAgo(l?.checkedAt)}</span>
          </div>
          ${l?.error ? `<div class="tracker-error-msg">⚠ ${esc(l.error)}</div>` : ''}
          <div class="tracker-actions">
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();checkNow(${t.id})">↻ Vérifier</button>
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();toggleActive(${t.id},${t.active})">${t.active ? '⏸ Pause' : '▶ Activer'}</button>
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditForm(${t.id})">✎ Éditer</button>
            <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteTracker(${t.id})">✕</button>
          </div>
        </div>`;
    }).join('');
  }

  // --- Actions ---
  async function loadTrackers() {
    trackers = await api('GET', '/trackers');
    render();
  }

  async function checkNow(id) {
    const card = document.querySelector(`[data-id="${id}"]`);
    card?.classList.add('loading');
    try {
      await api('POST', `/trackers/${id}/check`);
      await loadTrackers();
      if (selectedId === id) await loadHistory(id);
    } catch (e) { alert(e.message); }
    finally { card?.classList.remove('loading'); }
  }

  async function toggleActive(id, current) {
    await api('PATCH', `/trackers/${id}`, { active: !current });
    await loadTrackers();
  }

  async function deleteTracker(id) {
    if (!confirm('Supprimer ce tracker et tout son historique ?')) return;
    await api('DELETE', `/trackers/${id}`);
    if (selectedId === id) closeHistory();
    await loadTrackers();
  }

  // --- History ---
  async function loadHistory(id) {
    selectedId = id;
    render();

    const [tracker, entries] = await Promise.all([
      api('GET', `/trackers/${id}`),
      api('GET', `/history/${id}?limit=50`),
    ]);

    document.getElementById('history-title').textContent = tracker.name;
    document.getElementById('history-panel').classList.remove('hidden');

    const rev = [...entries].reverse();
    const labels = rev.map(e => fmtDate(e.checkedAt));
    const nums = rev.map(e => parseNum(e.value));
    const hasNums = nums.some(v => v !== null);

    if (historyChart) historyChart.destroy();
    const wrapper = document.getElementById('history-chart-wrapper');
    if (hasNums) {
      wrapper.style.display = '';
      historyChart = new Chart(
        document.getElementById('history-chart').getContext('2d'), {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: tracker.name,
              data: nums,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59,130,246,.08)',
              tension: 0.3,
              fill: true,
              pointRadius: 3,
            }],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: false } },
          },
        }
      );
    } else {
      wrapper.style.display = 'none';
    }

    document.getElementById('history-tbody').innerHTML = entries.map(e => `
      <tr>
        <td>${e.value ? esc(e.value) : '<em style="color:var(--muted)">—</em>'}</td>
        <td><span class="badge ${e.statusCode && e.statusCode < 400 ? 'badge-ok' : 'badge-err'}">${e.statusCode ?? '—'}</span></td>
        <td>${fmtDate(e.checkedAt)}</td>
        <td style="color:var(--error);font-size:.7rem">${e.error ? esc(e.error) : ''}</td>
      </tr>`).join('');

    document.getElementById('history-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function closeHistory() {
    selectedId = null;
    document.getElementById('history-panel').classList.add('hidden');
    if (historyChart) { historyChart.destroy(); historyChart = null; }
    render();
  }

  // --- Form ---
  function resetForm() {
    editingId = null;
    document.getElementById('form-add').reset();
    document.getElementById('f-editing-id').value = '';
    document.getElementById('form-title').textContent = 'Nouveau tracker';
    document.getElementById('btn-save').textContent = 'Créer le tracker';
    document.getElementById('add-form').classList.add('hidden');
  }

  function openEditForm(id) {
    const t = trackers.find(x => x.id === id);
    if (!t) return;
    editingId = id;
    document.getElementById('f-editing-id').value = id;
    document.getElementById('f-name').value = t.name;
    document.getElementById('f-url').value = t.url;
    document.getElementById('f-selector').value = t.selector;
    document.getElementById('f-interval').value = t.interval;
    document.getElementById('f-js-render').checked = t.jsRender;
    document.getElementById('form-title').textContent = 'Modifier le tracker';
    document.getElementById('btn-save').textContent = 'Enregistrer';
    document.getElementById('add-form').classList.remove('hidden');
    document.getElementById('add-form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('btn-toggle-form').addEventListener('click', () => {
    if (!document.getElementById('add-form').classList.contains('hidden') && editingId) {
      resetForm();
    } else {
      resetForm();
      document.getElementById('add-form').classList.toggle('hidden');
    }
  });

  document.getElementById('btn-cancel').addEventListener('click', resetForm);

  document.getElementById('form-add').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('btn-save');
    const isEdit = !!editingId;
    btn.disabled = true; btn.textContent = isEdit ? 'Enregistrement…' : 'Création…';
    try {
      const payload = {
        name:     document.getElementById('f-name').value,
        url:      document.getElementById('f-url').value,
        selector: document.getElementById('f-selector').value,
        interval: parseInt(document.getElementById('f-interval').value, 10),
        jsRender: document.getElementById('f-js-render').checked,
      };
      if (isEdit) {
        await api('PATCH', `/trackers/${editingId}`, payload);
      } else {
        await api('POST', '/trackers', payload);
      }
      resetForm();
      await loadTrackers();
      if (isEdit && selectedId === editingId) await loadHistory(editingId);
    } catch (e) { alert(e.message); }
    finally { btn.disabled = false; btn.textContent = isEdit ? 'Enregistrer' : 'Créer le tracker'; }
  });

  // --- Card click → history ---
  document.getElementById('trackers-container').addEventListener('click', e => {
    const card = e.target.closest('.tracker-card');
    if (!card) return;
    const id = parseInt(card.dataset.id, 10);
    selectedId === id ? closeHistory() : loadHistory(id);
  });

  document.getElementById('btn-close-history').addEventListener('click', closeHistory);

  // --- Init ---
  loadTrackers();
  setInterval(loadTrackers, 30_000);
</script>
</body>
</html>
